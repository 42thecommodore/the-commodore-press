name: Publish the Press

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The house rules are the gate. A failure here leaves the live site alone.
      - name: Check the house rules
        run: npm run check

      - name: Build
        run: npm run build

      # Pages must be switched on by hand once, at Settings -> Pages -> Source: GitHub
      # Actions. This step cannot do it: creating a Pages site needs repo-admin rights,
      # and the workflow token is only ever granted pages: write. Tried it — the run
      # fails with "Create Pages site failed: Resource not accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
