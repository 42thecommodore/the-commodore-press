name: Publish the Press

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history, so the sitemap and each page can say when an entry last changed
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The house rules are the gate. A failure here leaves the live site alone.
      - name: Check the house rules
        run: npm run check

      # SITE_URL is a repository variable, empty until a custom domain is bought. Empty
      # means the github.io address; set it and the build writes CNAME and every
      # absolute link (canonical, share cards, sitemap, feed) follows.
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Pages must be switched on by hand once, at Settings -> Pages -> Source: GitHub
      # Actions. This step cannot do it: creating a Pages site needs repo-admin rights,
      # and the workflow token is only ever granted pages: write. Tried it — the run
      # fails with "Create Pages site failed: Resource not accessible by integration".
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
